<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Forgot password — Expense Manager</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="container">
    <header class="app-header">
      <h1>Password reset</h1>
      <div class="header-actions">
        <button id="darkToggle" class="icon-btn">🌙</button>
      </div>
    </header>

    <section class="card">
      <form id="forgotForm" class="form">
        <p class="muted">Enter your account email and we'll send a reset link.</p>
        <input type="email" id="email" placeholder="Email" required autocomplete="email">
        <button type="submit" class="btn-primary">Send reset link</button>
      </form>

      <div class="links">
        <a href="index.html">Back to login</a>
      </div>
      <div id="msg" class="msg"></div>
    </section>

    <nav class="bottom-nav">
      <button class="nav-item active">Home</button>
      <button class="nav-item">Help</button>
      <button class="nav-item">Contact</button>
    </nav>
  </main>

  <script src="assets/js/app.js"></script>
</body>
</html>
